<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مساعد منصة إنجاز — Enjaz Assistant</title>
<!--
  The chat UI. Deliberately one file, no build step, no framework.

  Why: this is a demo build whose job is to show the backend working, and a
  node_modules tree, a bundler and a dev server would be three more things
  to install, version and explain for a page with four screens. Everything
  here is served as a static file by the same API process, so there is one
  thing to run.

  RTL is the default, not an option. The platform is Arabic-first and the
  primary users write Arabic; `dir` flips per message to match the language
  the backend detected, so a mixed conversation reads correctly both ways.

  Nothing here decides anything. The project list, the welcome, the
  language, the citations and the refusals all come from the API — the
  frontend renders what the backend already decided, which is the only way
  AC01-AC10 stay true of the system rather than of one client.
-->
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --ink: #16202c;
    --muted: #64748b;
    --line: #e2e8f0;
    --brand: #0f6b4f;
    --brand-soft: #e7f2ee;
    --user: #0f6b4f;
    --warn: #92400e;
    --warn-soft: #fef3c7;
    --danger: #9f1239;
    --danger-soft: #ffe4e6;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(16,32,44,.06), 0 4px 16px rgba(16,32,44,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --panel: #161b22; --ink: #e6edf3; --muted: #8b949e;
      --line: #30363d; --brand: #3fb98c; --brand-soft: #17352a;
      --user: #1f6f52; --warn: #fbbf24; --warn-soft: #3a2e12;
      --danger: #fda4af; --danger-soft: #3f1622;
      --shadow: 0 1px 2px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.65 "Segoe UI", Tahoma, system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 12px 20px; background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 700; font-size: 17px; color: var(--brand); }
  .brand small { display block; font-weight: 400; color: var(--muted); }
  header .spacer { flex: 1; }
  select, button {
    font: inherit; color: inherit; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px;
    cursor: pointer;
  }
  select:focus-visible, button:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--brand); outline-offset: 1px;
  }
  button.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
  button[disabled] { opacity: .5; cursor: not-allowed; }
  main { flex: 1; display: flex; min-height: 0; }
  #chat, #kb {
    flex: 1; overflow-y: auto; padding: 22px;
    display: flex; flex-direction: column; gap: 14px;
  }
  #kb { display: none; }
  body.kb-open #chat { display: none; }
  body.kb-open #kb { display: block; }

  .msg { max-width: 74ch; padding: 12px 15px; border-radius: var(--radius);
         background: var(--panel); box-shadow: var(--shadow);
         white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-start; background: var(--user); color: #fff; }
  html[dir="rtl"] .msg.user { align-self: flex-end; }
  .msg.assistant { align-self: flex-end; }
  html[dir="rtl"] .msg.assistant { align-self: flex-start; }
  .msg.system { align-self: center; max-width: 80ch; background: var(--brand-soft);
                border: 1px solid var(--line); }
  .msg.refusal { background: var(--warn-soft); color: var(--warn); }
  .msg.error { background: var(--danger-soft); color: var(--danger); }

  .cites { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line);
           font-size: 12.5px; color: var(--muted); }
  .cites b { color: var(--ink); font-weight: 600; }
  .cites div { margin-top: 3px; }
  .meta { margin-top: 6px; font-size: 11.5px; color: var(--muted); }

  form { display: flex; gap: 10px; padding: 14px 20px;
         border-top: 1px solid var(--line); background: var(--panel); }
  textarea { flex: 1; resize: none; font: inherit; color: inherit;
             background: var(--bg); border: 1px solid var(--line);
             border-radius: 10px; padding: 10px 12px; min-height: 46px;
             max-height: 160px; }

  table { border-collapse: collapse; width: 100%; background: var(--panel);
          border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
  th, td { padding: 10px 12px; text-align: start; border-bottom: 1px solid var(--line); }
  th { background: var(--brand-soft); font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 99px;
          font-size: 12px; background: var(--brand-soft); color: var(--brand); }
  .pill.pending { background: var(--warn-soft); color: var(--warn); }
  .pill.failed  { background: var(--danger-soft); color: var(--danger); }
  h2 { margin: 0 0 4px; font-size: 17px; }
  .hint { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .typing span { display:inline-block; width:6px; height:6px; margin:0 1px;
                 border-radius:50%; background: var(--muted);
                 animation: blink 1.2s infinite both; }
  .typing span:nth-child(2){animation-delay:.2s}
  .typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink { 0%,80%,100%{opacity:.25} 40%{opacity:1} }
</style>
</head>
<body>
<header>
  <div class="brand">مساعد منصة إنجاز<br><small>Enjaz Assistant</small></div>
  <label for="project" class="hint" style="margin:0">المشروع / Project</label>
  <select id="project" aria-label="Project switcher"></select>
  <span class="spacer"></span>
  <button id="kbToggle" type="button">قاعدة المعرفة / Knowledge base</button>
</header>

<main>
  <div id="chat" role="log" aria-live="polite" aria-label="Conversation"></div>
  <div id="kb"></div>
</main>

<form id="composer" autocomplete="off">
  <textarea id="q" rows="1" placeholder="اكتب سؤالك… / Ask a question…"
            aria-label="Question"></textarea>
  <button class="primary" id="send" type="submit">إرسال / Send</button>
</form>

<script>
/* ---------------------------------------------------------------------------
   The frontend renders decisions; it never makes them.

   In particular it never sends a username. Identity is established by the
   server from the request context, and a field here would be a field the
   server must then be trusted to ignore. See Application/backend/api/identity.py
   --------------------------------------------------------------------------- */
const API = "";                       // same origin as the API process
const $ = (id) => document.getElementById(id);
const chat = $("chat"), kb = $("kb"), projectSel = $("project");
let conversationId = null, busy = false;

const RTL = /[؀-ۿݐ-ݿﭐ-﷿ﹰ-﻿]/;

async function api(path, options) {
  const response = await fetch(API + path, {
    headers: { "Content-Type": "application/json" }, ...options,
  });
  if (!response.ok) {
    let detail = `HTTP ${response.status}`;
    try { detail = (await response.json()).detail || detail; } catch (_) {}
    const error = new Error(detail);
    error.status = response.status;
    throw error;
  }
  return response.status === 204 ? null : response.json();
}

function bubble(text, kind, { citations = [], meta = "", lang = "" } = {}) {
  const node = document.createElement("div");
  node.className = `msg ${kind}`;
  // Direction follows the *content*, so a bilingual transcript reads
  // correctly in both directions rather than forcing one on the other.
  node.dir = lang === "ar" ? "rtl" : lang === "en" ? "ltr"
           : (RTL.test(text) ? "rtl" : "ltr");
  node.textContent = text;

  if (citations.length) {
    const box = document.createElement("div");
    box.className = "cites";
    box.innerHTML = "<b>المصدر / Source</b>";
    for (const c of citations) {
      const line = document.createElement("div");
      line.textContent = "• " + c.label;
      box.appendChild(line);
    }
    node.appendChild(box);
  }
  if (meta) {
    const m = document.createElement("div");
    m.className = "meta";
    m.textContent = meta;
    node.appendChild(m);
  }
  chat.appendChild(node);
  chat.scrollTop = chat.scrollHeight;
  return node;
}

function thinking() {
  const node = document.createElement("div");
  node.className = "msg assistant typing";
  node.innerHTML = "<span></span><span></span><span></span>";
  chat.appendChild(node);
  chat.scrollTop = chat.scrollHeight;
  return node;
}

/* An outcome decides how a reply is *shown*. The backend already decided
   what it is; this only maps that to a colour. */
const STYLE = {
  answered: "assistant",
  handled_without_retrieval: "assistant",
  out_of_scope: "refusal",
  rejected_language: "refusal",
  no_language_detected: "refusal",
};

async function loadProjects() {
  const projects = await api("/api/projects");
  projectSel.innerHTML = "";
  if (!projects.length) {
    projectSel.innerHTML = "<option>لا توجد مشاريع / No projects</option>";
    projectSel.disabled = true;
    return null;
  }
  for (const p of projects) {
    const option = document.createElement("option");
    option.value = p.code;
    option.textContent = `${p.code} — ${p.display_name}`;
    projectSel.appendChild(option);
  }
  return projects[0].code;
}

async function openConversation(code) {
  chat.innerHTML = "";
  conversationId = null;
  try {
    const opened = await api("/api/conversations", {
      method: "POST", body: JSON.stringify({ project_code: code }),
    });
    conversationId = opened.conversation_id;
    // AC04: shown before anything is typed, and bilingual because no
    // question has been asked yet, so there is no language to reply in.
    bubble(opened.welcome, "system");
  } catch (error) {
    bubble(error.message, "error");
  }
}

async function ask(text) {
  if (!conversationId || busy) return;
  busy = true; $("send").disabled = true;
  bubble(text, "user");
  const pending = thinking();
  try {
    const reply = await api(`/api/conversations/${conversationId}/messages`, {
      method: "POST", body: JSON.stringify({ text }),
    });
    pending.remove();
    bubble(reply.text, STYLE[reply.outcome] || "assistant", {
      citations: reply.citations,
      lang: reply.reply_language,
      meta: `${reply.outcome} · ${reply.timings.total_ms} ms`,
    });
  } catch (error) {
    pending.remove();
    bubble(error.message, "error");
  } finally {
    busy = false; $("send").disabled = false; $("q").focus();
  }
}

async function loadKnowledgeBase(code) {
  kb.innerHTML = "<p class='hint'>…</p>";
  try {
    const data = await api(`/api/projects/${encodeURIComponent(code)}/documents`);
    const rows = data.documents.map((d) => `
      <tr>
        <td>${escapeHtml(d.filename)}</td>
        <td>${escapeHtml(d.doc_type)}</td>
        <td><span class="pill ${d.indexing_status !== "indexed" ? d.indexing_status : ""}">${escapeHtml(d.indexing_status)}</span></td>
        <td>${d.chunk_count ?? "—"}</td>
        <td>${d.indexed_at ? escapeHtml(d.indexed_at.slice(0, 10)) : "—"}</td>
      </tr>`).join("");
    kb.innerHTML = `
      <h2>قاعدة المعرفة — ${escapeHtml(data.project_code)}</h2>
      <p class="hint">${data.indexed} / ${data.total} مفهرس · indexed —
        عرض فقط، لا يمكن التعديل / view only</p>
      <table>
        <thead><tr>
          <th>الملف / File</th><th>النوع / Type</th>
          <th>الحالة / Status</th><th>المقاطع / Chunks</th>
          <th>آخر فهرسة / Indexed</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  } catch (error) {
    kb.innerHTML = `<div class="msg error">${escapeHtml(error.message)}</div>`;
  }
}

/* Everything from the API is treated as text, not markup. The document
   corpus is not trusted input -- the same reasoning as fencing passages in
   the prompt, applied to the DOM. */
function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g,
    (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;",
               '"': "&quot;", "'": "&#39;" }[ch]));
}

$("composer").addEventListener("submit", (event) => {
  event.preventDefault();
  const text = $("q").value.trim();
  if (!text) return;
  $("q").value = "";
  $("q").style.height = "auto";
  ask(text);
});

$("q").addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    $("composer").requestSubmit();
  }
});
$("q").addEventListener("input", (event) => {
  event.target.style.height = "auto";
  event.target.style.height = Math.min(event.target.scrollHeight, 160) + "px";
});

projectSel.addEventListener("change", () => {
  // A project switch is a new session and therefore a new conversation --
  // a Conversation is bound to one project for its lifetime (AC09).
  document.body.classList.remove("kb-open");
  openConversation(projectSel.value);
});

$("kbToggle").addEventListener("click", () => {
  document.body.classList.toggle("kb-open");
  if (document.body.classList.contains("kb-open")) {
    loadKnowledgeBase(projectSel.value);
  }
});

(async function start() {
  try {
    const first = await loadProjects();
    if (first) await openConversation(first);
  } catch (error) {
    bubble(error.message, "error");
  }
})();
</script>
</body>
</html>
