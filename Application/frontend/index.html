<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة الوكيل الذكي — Smart Agent Platform</title>
<!--
  The whole UI: sign-in, dashboard, project picker, assistant chat, and the
  knowledge base. One static file, no build step, no framework, served by
  the API process on the same origin.

  Why one file: this is a demo build whose job is to show the backend
  working. A node_modules tree, a bundler and a second dev server would be
  three more things to install, version and explain for five screens.

  The frontend renders decisions; it never makes them. The project list, the
  welcome, the detected language, the intent, the citations and every
  refusal all come from the API. It never sends a username — the server
  establishes identity from a signed session cookie, and a field here would
  be a field the server must then be trusted to ignore.

  Everything from the API is inserted as text, never markup. Document
  content is not trusted input; that is the prompt-fencing reasoning applied
  to the DOM.
-->
<style>
  :root {
    --brand:        #5B4FE9;   /* the platform indigo from the mockups */
    --brand-strong: #4B3FD4;
    --brand-soft:   #EFEDFE;
    --mof:          #1D6B54;   /* Ministry of Finance green — footer, logo */
    --page:         #F5F7FA;
    --panel:        #FFFFFF;
    --ink:          #1A2331;
    --muted:        #6B7A90;
    --line:         #E3E8EF;
    --ok:           #17795E;  --ok-soft:   #E3F5EF;
    --warn:         #9A6206;  --warn-soft: #FDF1DC;
    --bad:          #B3261E;  --bad-soft:  #FCE9E7;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(26,35,49,.05), 0 8px 24px rgba(26,35,49,.06);
    --sans: "Segoe UI", Tahoma, system-ui, -apple-system, "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--page); color: var(--ink); font-family: var(--sans);
    font-size: 15px; line-height: 1.6;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .55; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .hidden { display: none !important; }

  /* ---------- shared chrome ---------- */
  .langtoggle { position: fixed; inset-block-start: 14px; inset-inline-start: 16px;
                display: flex; gap: 4px; background: var(--panel);
                border: 1px solid var(--line); border-radius: 99px; padding: 3px;
                z-index: 60; box-shadow: var(--shadow); }
  .langtoggle button { border: 0; background: transparent; border-radius: 99px;
                       padding: 3px 12px; font-size: 12.5px; color: var(--muted); }
  .langtoggle button[aria-pressed="true"] { background: var(--brand); color: #fff; }

  .logo { display: flex; align-items: center; gap: 9px; font-weight: 700; }
  .logo .mark { width: 30px; height: 30px; border-radius: 8px; background: var(--mof);
                color: #fff; display: grid; place-items: center; font-size: 15px; }
  .logo small { display: block; font-weight: 400; font-size: 10.5px; color: var(--muted); }

  .footerbar { background: var(--mof); color: #fff; text-align: center;
               padding: 11px 16px; font-size: 12.5px;
               display: flex; justify-content: center; gap: 22px; flex-wrap: wrap; }
  .footerbar a { color: #DDEDE6; text-decoration: none; }

  /* ---------- sign-in ---------- */
  #login { min-height: 100%; display: flex; flex-direction: column; }
  #login .middle { flex: 1; display: grid; place-items: center; padding: 32px 16px; }
  .card { background: var(--panel); border: 1px solid var(--line);
          border-radius: 16px; box-shadow: var(--shadow); padding: 34px 32px;
          width: min(430px, 100%); text-align: center; }
  .card h1 { margin: 16px 0 6px; font-size: 23px; }
  .card .sub { color: var(--muted); font-size: 13.5px; margin: 0 0 26px; }
  .field { text-align: start; margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
  .field input { width: 100%; padding: 11px 13px; border: 1px solid var(--line);
                 border-radius: 9px; background: var(--page); }
  .field input:focus { background: var(--panel); }
  .btn { width: 100%; padding: 11px 16px; border: 0; border-radius: 9px;
         background: var(--brand); color: #fff; font-weight: 600; }
  .btn:hover:not(:disabled) { background: var(--brand-strong); }
  .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .note { margin: 18px 0 0; font-size: 11.5px; color: var(--muted); }
  .alert { background: var(--bad-soft); color: var(--bad); border-radius: 9px;
           padding: 9px 12px; font-size: 13px; margin-bottom: 14px; text-align: start; }

  /* ---------- app shell ---------- */
  #app { min-height: 100%; display: grid; grid-template-columns: 262px 1fr;
         grid-template-rows: 1fr auto; }
  aside { grid-row: 1 / 3; background: var(--panel);
          border-inline-start: 1px solid var(--line);
          display: flex; flex-direction: column; padding: 16px 14px; gap: 18px; }
  html[dir="ltr"] aside { border-inline-start: 0; border-inline-end: 1px solid var(--line); }
  .side-label { font-size: 11px; letter-spacing: .04em; color: var(--muted);
                text-transform: uppercase; margin: 0 6px 7px; }
  .projectbtn { width: 100%; text-align: start; background: var(--brand-soft);
                border: 1px solid #D8D3FB; border-radius: 10px; padding: 10px 12px;
                display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .projectbtn b { display: block; font-size: 13px; color: var(--brand-strong); }
  .projectbtn span { font-size: 11.5px; color: var(--muted); }
  nav { display: flex; flex-direction: column; gap: 2px; }
  nav a { display: flex; align-items: center; justify-content: space-between; gap: 8px;
          padding: 9px 12px; border-radius: 9px; text-decoration: none;
          color: var(--ink); font-size: 14px; }
  nav a:hover { background: var(--page); }
  nav a.active { background: var(--brand-soft); color: var(--brand-strong); font-weight: 600; }
  nav a.disabled { color: #A9B4C4; pointer-events: none; }
  nav .sub { padding-inline-start: 26px; font-size: 13.5px; }
  .count { background: var(--bad-soft); color: var(--bad); border-radius: 99px;
           font-size: 11px; padding: 1px 8px; font-weight: 600; }
  .who { margin-top: auto; border-top: 1px solid var(--line); padding-top: 12px;
         display: flex; align-items: center; gap: 10px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--brand);
            color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 600; }
  .who b { display: block; font-size: 13px; } .who span { font-size: 11.5px; color: var(--muted); }
  .who button { border: 0; background: transparent; color: var(--muted); font-size: 12px;
                text-decoration: underline; padding: 0; }

  main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .topbar { background: var(--panel); border-bottom: 1px solid var(--line);
            padding: 12px 22px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .topbar h2 { margin: 0; font-size: 15.5px; }
  .topbar .meta { font-size: 12px; color: var(--muted); }
  .topbar .spacer { flex: 1; }
  .linkbtn { background: transparent; border: 0; color: var(--brand);
             font-size: 13px; text-decoration: underline; }
  .view { flex: 1; overflow-y: auto; padding: 22px; min-height: 0; }

  /* ---------- dashboard ---------- */
  .empty { max-width: 620px; margin: 6vh auto; text-align: center; color: var(--muted); }
  .empty h3 { color: var(--ink); font-size: 20px; margin: 0 0 8px; }
  .tiles { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(190px,1fr));
           margin-top: 26px; text-align: start; }
  .tile { background: var(--panel); border: 1px solid var(--line);
          border-radius: var(--radius); padding: 16px; }
  .tile b { display: block; font-size: 22px; } .tile span { font-size: 12.5px; color: var(--muted); }

  /* ---------- chat ---------- */
  #chatView { display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 78ch; padding: 12px 15px; border-radius: var(--radius);
         background: var(--panel); box-shadow: var(--shadow); white-space: pre-wrap;
         overflow-wrap: anywhere; border: 1px solid var(--line); }
  .msg.user { align-self: flex-end; background: #1E293B; color: #fff; border-color: #1E293B; }
  html[dir="ltr"] .msg.user { align-self: flex-start; }
  .msg.assistant { align-self: flex-start; }
  html[dir="ltr"] .msg.assistant { align-self: flex-end; }
  .msg.welcome { align-self: stretch; max-width: none; background: var(--brand-soft);
                 border-color: #D8D3FB; }
  .msg.refusal { background: var(--warn-soft); border-color: #F0DDBB; color: var(--warn); }
  .msg.error { background: var(--bad-soft); border-color: #F3CFCB; color: var(--bad); }
  .cites { margin-top: 10px; padding-top: 9px; border-top: 1px dashed var(--line);
           font-size: 12.5px; color: var(--muted); }
  .cites b { color: var(--ink); }
  .metaline { margin-top: 7px; font-size: 11px; color: var(--muted); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 22px 4px; }
  .chips button { border: 1px solid var(--line); background: var(--panel);
                  border-radius: 99px; padding: 6px 14px; font-size: 13px;
                  color: var(--brand-strong); }
  .chips button:hover { border-color: var(--brand); background: var(--brand-soft); }
  .composer { border-top: 1px solid var(--line); background: var(--panel);
              padding: 13px 22px; display: flex; gap: 10px; }
  .composer textarea { flex: 1; resize: none; border: 1px solid var(--line);
                       border-radius: 10px; padding: 10px 13px; background: var(--page);
                       min-height: 44px; max-height: 150px; }
  .composer button { padding: 0 20px; border: 0; border-radius: 10px;
                     background: var(--brand); color: #fff; font-weight: 600; }
  .typing span { display:inline-block; width:6px; height:6px; margin:0 1px;
                 border-radius:50%; background: var(--muted); animation: blink 1.2s infinite both; }
  .typing span:nth-child(2){animation-delay:.2s} .typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink { 0%,80%,100%{opacity:.25} 40%{opacity:1} }
  @media (prefers-reduced-motion: reduce) { .typing span { animation: none; opacity: .6; } }

  /* ---------- knowledge base ---------- */
  .kbhead { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
  .kbhead h3 { margin: 0; font-size: 19px; }
  .kbhead p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .tabs button { border: 1px solid var(--line); background: var(--panel);
                 border-radius: 99px; padding: 5px 14px; font-size: 13px; }
  .tabs button[aria-pressed="true"] { background: var(--brand); color: #fff; border-color: var(--brand); }
  .tablewrap { background: var(--panel); border: 1px solid var(--line);
               border-radius: var(--radius); overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 560px; }
  th, td { padding: 11px 15px; text-align: start; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  th { background: #FAFBFD; color: var(--muted); font-size: 11.5px;
       text-transform: uppercase; letter-spacing: .04em; }
  tr:last-child td { border-bottom: 0; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 12px; }
  .pill.indexed { background: var(--ok-soft); color: var(--ok); }
  .pill.pending, .pill.processing { background: var(--warn-soft); color: var(--warn); }
  .pill.failed { background: var(--bad-soft); color: var(--bad); }

  /* ---------- modal ---------- */
  .backdrop { position: fixed; inset: 0; background: rgba(26,35,49,.45);
              display: grid; place-items: center; z-index: 70; padding: 18px; }
  .modal { background: var(--panel); border-radius: 16px; box-shadow: var(--shadow);
           width: min(560px,100%); max-height: 84vh; display: flex; flex-direction: column; }
  .modal header { padding: 20px 22px 12px; }
  .modal h3 { margin: 0 0 4px; font-size: 18px; }
  .modal p { margin: 0; color: var(--muted); font-size: 13px; }
  .modal .body { padding: 4px 22px; overflow-y: auto; }
  .modal footer { padding: 14px 22px 20px; display: flex; gap: 10px; justify-content: flex-end; }
  .modal footer .btn { width: auto; }
  .pick { width: 100%; text-align: start; background: var(--panel); border: 1px solid var(--line);
          border-radius: 10px; padding: 11px 13px; margin-bottom: 8px;
          display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .pick:hover { border-color: var(--brand); }
  .pick[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); }
  .pick b { display: block; font-size: 12px; color: var(--brand-strong); }
  .pick span { font-size: 13px; }

  @media (max-width: 820px) {
    #app { grid-template-columns: 1fr; }
    aside { grid-row: auto; border: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>

<div class="langtoggle" role="group" aria-label="Language">
  <button type="button" data-lang="en" aria-pressed="false">EN</button>
  <button type="button" data-lang="ar" aria-pressed="true">AR</button>
</div>

<!-- ============ SIGN-IN ============ -->
<section id="login">
  <div class="middle">
    <form class="card" id="loginForm" autocomplete="on">
      <div class="logo" style="justify-content:center">
        <span class="mark">و</span>
        <span>وزارة المالية<small>Ministry of Finance</small></span>
      </div>
      <h1 data-t="platform">منصة الوكيل الذكي</h1>
      <p class="sub" data-t="tagline"></p>
      <div id="loginError" class="alert hidden"></div>
      <div class="field">
        <label for="email" data-t="email"></label>
        <input id="email" name="email" type="email" required
               autocomplete="username" placeholder="name@enjaz.gov.sa">
      </div>
      <div class="field">
        <label for="password" data-t="password"></label>
        <input id="password" name="password" type="password" required
               autocomplete="current-password" placeholder="••••••••">
      </div>
      <button class="btn" id="loginBtn" type="submit" data-t="signin"></button>
      <p class="note" data-t="ssonote"></p>
    </form>
  </div>
  <div class="footerbar">
    <span data-t="copyright"></span>
  </div>
</section>

<!-- ============ APP ============ -->
<section id="app" class="hidden">
  <aside>
    <div class="logo">
      <span class="mark">و</span>
      <span data-t="platform">منصة الوكيل الذكي<small>Smart Agent Platform</small></span>
    </div>

    <div>
      <p class="side-label" data-t="project"></p>
      <button class="projectbtn" id="projectBtn" type="button">
        <span><b id="projCode">—</b><span id="projName"></span></span>
        <span aria-hidden="true">⇅</span>
      </button>
      <p class="side-label" style="margin-top:6px" data-t="assignedonly"></p>
    </div>

    <nav>
      <p class="side-label" data-t="section"></p>
      <a href="#" data-view="dashboard" class="active" data-t="dashboard"></a>
      <p class="side-label" style="margin-top:10px" data-t="agents"></p>
      <a href="#" class="disabled"><span data-t="riskradar"></span><span class="count">4</span></a>
      <a href="#" class="disabled"><span data-t="lessons"></span><span class="count">2</span></a>
      <a href="#" data-view="chat" data-t="assistant"></a>
      <a href="#" data-view="chat" class="sub" data-t="conversation"></a>
      <a href="#" data-view="kb" class="sub" data-t="knowledgebase"></a>
    </nav>

    <div class="who">
      <div class="avatar" id="avatar">—</div>
      <div style="flex:1">
        <b id="whoName"></b>
        <span id="whoRole" data-t="rolelabel"></span>
        <br><button type="button" id="logoutBtn" data-t="signout"></button>
      </div>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <div>
        <h2 id="barTitle"></h2>
        <div class="meta" id="barMeta"></div>
      </div>
      <span class="spacer"></span>
      <button class="linkbtn" id="switchBtn" type="button" data-t="switchproject"></button>
    </div>

    <div class="view" id="dashboardView">
      <div class="empty">
        <h3 data-t="dashtitle"></h3>
        <p data-t="dashbody"></p>
        <div class="tiles">
          <div class="tile"><b id="tileProjects">—</b><span data-t="tileprojects"></span></div>
          <div class="tile"><b id="tileDocs">—</b><span data-t="tiledocs"></span></div>
          <div class="tile"><b data-t="tilesoon">—</b><span data-t="tileagents"></span></div>
        </div>
      </div>
    </div>

    <div class="view hidden" id="chatView" role="log" aria-live="polite"></div>

    <div class="view hidden" id="kbView"></div>

    <div class="chips hidden" id="chips"></div>
<form class="composer hidden" id="composer">
      <textarea id="q" rows="1" aria-label="Message"></textarea>
      <button type="submit" id="sendBtn" data-t="send"></button>
    </form>

    <div class="footerbar">
      <span data-t="copyright"></span>
      <a href="#" data-t="terms"></a>
      <a href="#" data-t="privacy"></a>
    </div>
  </main>
</section>

    noProjects:"You have no assigned projects.", pickFirst:"Choose a project first.",
    loginFailed:"That email or password is not correct.",
    thinking:"Thinking…", sources:"Source",
    docsIndexed:"documents indexed", tooFast:"That is a lot of questions at once. Please wait a moment and try again.",
    expired:"Your session has ended. Please sign in again.",
    try1:"Give me an overview of this project", try2:"What are the top risks?", try3:"What is the approved budget?"
  }
};

const $ = (id) => document.getElementById(id);
const RTL = /[؀-ۿݐ-ݿﭐ-﷿ﹰ-﻿]/;
let UI = "ar", ME = null, PROJECTS = [], CURRENT = null, CONV = null, BUSY = false;
let DOC_COUNT = null;   // indexed documents in CURRENT, or null before it loads
let KB_FILTER = "all", KB_DATA = null;

const t = (key) => T[UI][key] ?? key;

async function api(path, options = {}) {
  const response = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    credentials: "same-origin", ...options,
  });
  if (!response.ok) {
    let detail = `HTTP ${response.status}`;
    try { detail = (await response.json()).detail || detail; } catch (_) {}
    // The server answers a rate limit and an expired session with codes, not
    // prose, so the wording is chosen here in the user's UI language rather
    // than showing an English detail string to an Arabic reader.
    if (response.status === 429) detail = t("tooFast");
    const error = new Error(detail); error.status = response.status; throw error;
  }
  return response.status === 204 ? null : response.json();
}

function applyLanguage() {
  document.documentElement.lang = UI;
  document.documentElement.dir = UI === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach((node) => {
    const key = node.dataset.t;
    if (node.tagName === "SPAN" && node.parentElement?.classList.contains("logo")) {
      node.innerHTML = "";
      node.append(t("platform"));
      const small = document.createElement("small");
      small.textContent = UI === "ar" ? "Smart Agent Platform" : "منصة الوكيل الذكي";
      node.appendChild(small);
      return;
    }
    node.textContent = t(key);
  });
  $("q").placeholder = t("placeholder");
  document.querySelectorAll(".langtoggle button").forEach((b) =>
    b.setAttribute("aria-pressed", String(b.dataset.lang === UI)));
  if (ME) renderWho();
  if (CURRENT) renderTopbar();
  if (KB_DATA) renderKb();
}

/* ---------------------------- sign-in ---------------------------- */
$("loginForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  const btn = $("loginBtn"); btn.disabled = true;
  $("loginError").classList.add("hidden");
  try {
    ME = await api("/api/auth/login", { method: "POST", body: JSON.stringify({
      email: $("email").value.trim(), password: $("password").value }) });
    $("password").value = "";
    await enterApp();
  } catch (error) {
    // One message for a wrong password and an unknown address — the server
    // does not distinguish them, and neither should the screen.
    $("loginError").textContent = error.status === 403 ? t("loginFailed") : error.message;
    $("loginError").classList.remove("hidden");
  } finally { btn.disabled = false; }
});

$("logoutBtn").addEventListener("click", async () => {
  await api("/api/auth/logout", { method: "POST" }).catch(() => {});
  toLogin();
});

function toLogin() {
  ME = null; CONV = null; CURRENT = null; PROJECTS = [];
  DOC_COUNT = null; KB_DATA = null;
  $("chatView").innerHTML = "";
  $("app").classList.add("hidden");
  $("login").classList.remove("hidden");
}

function endSession() {
  // The cookie expired, or the account was removed. Showing a dead chat
  // that 403s on every message is worse than saying so once. The chat is
  // cleared with it: those turns belong to a session that no longer exists.
  toLogin();
  $("loginError").textContent = t("expired");
  $("loginError").classList.remove("hidden");
}

function renderWho() {
  const name = UI === "ar" ? ME.full_name_ar : ME.full_name_en;
  $("whoName").textContent = name;
  $("avatar").textContent = (name || "?").trim()[0];
}

async function enterApp() {
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  renderWho();
  PROJECTS = await api("/api/projects");
  $("tileProjects").textContent = PROJECTS.length;
  if (!PROJECTS.length) { CURRENT = null; renderTopbar(); return; }
  CURRENT = PROJECTS[0];
  renderTopbar();
  showView("dashboard");
  refreshDocCount();
}

async function refreshDocCount() {
  if (!CURRENT) return;
  try {
    const kb = await api(`/api/projects/${encodeURIComponent(CURRENT.code)}/documents`);
    $("tileDocs").textContent = `${kb.indexed}/${kb.total}`;
    DOC_COUNT = kb.indexed;
    renderTopbar();
  } catch (_) { $("tileDocs").textContent = "—"; }
}

/* ---------------------------- project switching ---------------------------- */
function renderTopbar() {
  $("projCode").textContent = CURRENT ? CURRENT.code : "—";
  $("projName").textContent = CURRENT ? CURRENT.display_name : t("noProjects");
  $("barTitle").textContent = CURRENT ? CURRENT.display_name : t("noProjects");
  // The count is appended only once it is known, so a slow or failed
  // lookup leaves the code standing rather than a "0 documents" that reads
  // as an answer about the project.
  $("barMeta").textContent = !CURRENT ? ""
    : DOC_COUNT === null ? CURRENT.code
    : `${CURRENT.code} · ${DOC_COUNT} ${t("docsIndexed")}`;
}

function openPicker() {
  if (!PROJECTS.length) return;
  let chosen = CURRENT ? CURRENT.code : PROJECTS[0].code;
  const backdrop = document.createElement("div");
  backdrop.className = "backdrop";
  backdrop.innerHTML = `<div class="modal" role="dialog" aria-modal="true">
    <header><h3></h3><p></p></header>
    <div class="body"></div>
    <footer><button class="btn ghost" data-act="cancel"></button>
            <button class="btn" data-act="ok"></button></footer></div>`;
  backdrop.querySelector("h3").textContent = t("pickTitle");
  backdrop.querySelector("p").textContent = t("pickBody");
  backdrop.querySelector('[data-act="cancel"]').textContent = t("cancel");
  backdrop.querySelector('[data-act="ok"]').textContent = t("pickConfirm");

  const body = backdrop.querySelector(".body");
  for (const project of PROJECTS) {
    const row = document.createElement("button");
    row.type = "button"; row.className = "pick";
    row.setAttribute("aria-pressed", String(project.code === chosen));
    const left = document.createElement("span");
    left.innerHTML = "";
    const code = document.createElement("b"); code.textContent = project.code;
    const nm = document.createElement("span"); nm.textContent = project.display_name;
    left.append(code, nm);
    row.append(left);
    if (CURRENT && project.code === CURRENT.code) {
      const badge = document.createElement("span");
      badge.className = "pill indexed"; badge.textContent = t("current");
      row.append(badge);
    }
    row.addEventListener("click", () => {
      chosen = project.code;
      body.querySelectorAll(".pick").forEach((n) => n.setAttribute("aria-pressed", "false"));
      row.setAttribute("aria-pressed", "true");
    });
    body.append(row);
  }

  const close = () => backdrop.remove();
  backdrop.querySelector('[data-act="cancel"]').addEventListener("click", close);
  backdrop.querySelector('[data-act="ok"]').addEventListener("click", () => {
    const next = PROJECTS.find((p) => p.code === chosen);
    close();
    if (!next || (CURRENT && next.code === CURRENT.code)) return;
    // A conversation is bound to one project for its lifetime, so switching
    // means a new one. Confirm first when there is something to lose.
    if (CONV && $("chatView").children.length > 1 && !confirm(t("switchWarn"))) return;
    CURRENT = next; CONV = null; KB_DATA = null; DOC_COUNT = null;
    $("chatView").innerHTML = "";
    renderTopbar(); refreshDocCount();
    if (!$("chatView").classList.contains("hidden")) startConversation();
    if (!$("kbView").classList.contains("hidden")) loadKb();
  });
  backdrop.addEventListener("click", (e) => { if (e.target === backdrop) close(); });
  document.body.append(backdrop);
}
$("projectBtn").addEventListener("click", openPicker);
$("switchBtn").addEventListener("click", openPicker);

/* ---------------------------- views ---------------------------- */
function showView(name) {
  for (const [id, view] of [["dashboardView","dashboard"],["chatView","chat"],["kbView","kb"]]) {
    $(id).classList.toggle("hidden", view !== name);
  }
  $("composer").classList.toggle("hidden", name !== "chat");
  if (name !== "chat") $("chips").classList.add("hidden");
  document.querySelectorAll("nav a").forEach((a) =>
    a.classList.toggle("active", a.dataset.view === name && !a.classList.contains("disabled")));
  if (name === "chat" && !CONV) startConversation();
  if (name === "kb") loadKb();
}
document.querySelectorAll("nav a[data-view]").forEach((a) =>
  a.addEventListener("click", (e) => { e.preventDefault(); showView(a.dataset.view); }));

/* ---------------------------- chat ---------------------------- */
function bubble(text, kind, { citations = [], meta = "", lang = "" } = {}) {
  const node = document.createElement("div");
  node.className = `msg ${kind}`;
  node.dir = lang === "ar" ? "rtl" : lang === "en" ? "ltr"
           : (RTL.test(text) ? "rtl" : "ltr");
  node.textContent = text;
  if (citations.length) {
    const box = document.createElement("div"); box.className = "cites";
    const head = document.createElement("b"); head.textContent = t("sources");
    box.append(head);
    for (const c of citations) {
      const line = document.createElement("div");
      line.textContent = "• " + c.label;
      box.append(line);
    }
    node.append(box);
  }
  if (meta) {
    const m = document.createElement("div"); m.className = "metaline";
    m.textContent = meta; node.append(m);
  }
  $("chatView").append(node);
  $("chatView").scrollTop = $("chatView").scrollHeight;
  return node;
}

async function startConversation() {
  if (!CURRENT) { bubble(t("pickFirst"), "refusal"); return; }
  $("chatView").innerHTML = "";
  try {
    const opened = await api("/api/conversations", { method: "POST",
      body: JSON.stringify({ project_code: CURRENT.code, ui_language: UI }) });
    CONV = opened.conversation_id;
    // AC04 — shown before anything is typed, so it is bilingual: with no
    // message there is no language to reply in.
    bubble(opened.welcome, "welcome");
    renderChips();
  } catch (error) {
    if (error.status === 403 && ME) return endSession();
    bubble(error.message, "error");
  }
}

function renderChips() {
  // The starters from the mockup. They are ordinary messages, not a menu:
  // each one goes through the same path as anything typed, so the model
  // still classifies it rather than being handed a pre-decided intent.
  const box = $("chips");
  box.innerHTML = "";
  for (const key of ["try1", "try2", "try3"]) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = t(key);
    b.addEventListener("click", () => { box.classList.add("hidden"); ask(t(key)); });
    box.append(b);
  }
  box.classList.remove("hidden");
}

/* An outcome decides how a reply is SHOWN. The model already decided what
   it is; this only picks a colour. */
const STYLE = { answered:"assistant", conversational:"assistant",
                out_of_scope:"refusal", rejected_language:"refusal" };

async function ask(text) {
  if (!CONV || BUSY) return;
  BUSY = true; $("sendBtn").disabled = true;
  $("chips").classList.add("hidden");
  bubble(text, "user");
  const pending = bubble("", "assistant");
  pending.classList.add("typing");
  pending.innerHTML = "<span></span><span></span><span></span>";
  try {
    const reply = await api(`/api/conversations/${CONV}/messages`,
      { method: "POST", body: JSON.stringify({ text }) });
    pending.remove();
    bubble(reply.text, STYLE[reply.outcome] || "assistant", {
      citations: reply.citations, lang: reply.reply_language,
      meta: `${reply.intent || reply.outcome} · ${reply.timings.total_ms} ms`,
    });
  } catch (error) {
    pending.remove();
    if (error.status === 403 && ME) { return endSession(); }
    bubble(error.message, "error");
  } finally { BUSY = false; $("sendBtn").disabled = false; $("q").focus(); }
}

$("composer").addEventListener("submit", (event) => {
  event.preventDefault();
  const text = $("q").value.trim();
  if (!text) return;
  $("q").value = ""; $("q").style.height = "auto";
  ask(text);
});
$("q").addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault(); $("composer").requestSubmit();
  }
});
$("q").addEventListener("input", (event) => {
  event.target.style.height = "auto";
  event.target.style.height = Math.min(event.target.scrollHeight, 150) + "px";
});

/* ---------------------------- knowledge base ---------------------------- */
async function loadKb() {
  if (!CURRENT) { $("kbView").textContent = t("pickFirst"); return; }
  $("kbView").textContent = "…";
  try {
    KB_DATA = await api(`/api/projects/${encodeURIComponent(CURRENT.code)}/documents`);
    renderKb();
  } catch (error) {
    $("kbView").innerHTML = "";
    const box = document.createElement("div");
    box.className = "msg error"; box.textContent = error.message;
    $("kbView").append(box);
  }
}

function renderKb() {
  const data = KB_DATA;
  const counts = { all: data.documents.length, indexed: 0, processing: 0, failed: 0 };
  for (const d of data.documents) {
    if (d.indexing_status === "indexed") counts.indexed++;
    else if (d.indexing_status === "failed") counts.failed++;
    else counts.processing++;
  }
  const rows = data.documents.filter((d) =>
    KB_FILTER === "all" ||
    (KB_FILTER === "indexed" && d.indexing_status === "indexed") ||
    (KB_FILTER === "failed" && d.indexing_status === "failed") ||
    (KB_FILTER === "processing" &&
      d.indexing_status !== "indexed" && d.indexing_status !== "failed"));

  $("kbView").innerHTML = "";
  const head = document.createElement("div"); head.className = "kbhead";
  const title = document.createElement("div");
  const h3 = document.createElement("h3");
  h3.textContent = `${t("kbtitle")} — ${data.project_code}`;
  const p = document.createElement("p"); p.textContent = t("kbsub");
  title.append(h3, p);
  const spacer = document.createElement("span"); spacer.style.flex = "1";
  const upload = document.createElement("button");
  upload.className = "btn"; upload.style.width = "auto";
  upload.textContent = t("upload");
  // Deliberately inert: mid-chat upload (CAG) is not built, and a button
  // that looks live but does nothing is worse than one that says so.
  upload.disabled = true; upload.title = t("uploadsoon");
  head.append(title, spacer, upload);
  $("kbView").append(head);

  const tabs = document.createElement("div"); tabs.className = "tabs";
  for (const [key, label] of [["all", t("all")], ["indexed", t("indexed")],
                              ["processing", t("processing")], ["failed", t("failed")]]) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = `${label} ${counts[key]}`;
    b.setAttribute("aria-pressed", String(KB_FILTER === key));
    b.addEventListener("click", () => { KB_FILTER = key; renderKb(); });
    tabs.append(b);
  }
  $("kbView").append(tabs);

  const wrap = document.createElement("div"); wrap.className = "tablewrap";
  const table = document.createElement("table");
  const thead = document.createElement("thead");
  const hr = document.createElement("tr");
  for (const key of ["docname","doctype","docstate","docchunks","docdate"]) {
    const th = document.createElement("th"); th.textContent = t(key); hr.append(th);
  }
  thead.append(hr); table.append(thead);
  const tbody = document.createElement("tbody");
  for (const d of rows) {
    const tr = document.createElement("tr");
    const cells = [d.filename, d.doc_type, null, d.chunk_count ?? "—",
                   d.indexed_at ? d.indexed_at.slice(0, 10) : "—"];
    cells.forEach((value, index) => {
      const td = document.createElement("td");
      if (index === 2) {
        const pill = document.createElement("span");
        pill.className = `pill ${d.indexing_status}`;
        pill.textContent = d.indexing_status;
        td.append(pill);
      } else { td.textContent = String(value); }
      tr.append(td);
    });
    tbody.append(tr);
  }
  table.append(tbody); wrap.append(table); $("kbView").append(wrap);
}

/* ---------------------------- boot ---------------------------- */
document.querySelectorAll(".langtoggle button").forEach((b) =>
  b.addEventListener("click", () => { UI = b.dataset.lang; applyLanguage(); }));

(async function start() {
  applyLanguage();
  try {
    ME = await api("/api/auth/me");
    await enterApp();
  } catch (_) {
    // Not signed in — the sign-in screen is already the visible one.
  }
})();
</script>
</body>
</html>
