<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة الوكيل الذكي — Smart Agent Platform</title>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<!--
  The whole UI: sign-in, project picker, assistant chat, and the knowledge
  base. One static file, no build step, no framework, served by the API
  process on the same origin. The look follows the MOF design screens:
  DIN Next LT Arabic, the ministry teal #005459, and the brand logo.

  Why one file: this is a demo build whose job is to show the backend
  working. A node_modules tree, a bundler and a second dev server would be
  three more things to install, version and explain for a handful of screens.

  The frontend renders decisions; it never makes them. The project list, the
  welcome, the detected language, the intent, the citations and every
  refusal all come from the API. It never sends a username — the server
  establishes identity from a signed session cookie, and a field here would
  be a field the server must then be trusted to ignore.

  Everything from the API is inserted as text, never markup. Document
  content is not trusted input; that is the prompt-fencing reasoning applied
  to the DOM. Icons are CSS masks for the same reason: no markup string is
  ever built at runtime, not even a trusted one.

  Nothing on screen is invented. The design shows counts on the other agents
  and a notification dot; neither has data behind it, so the agents are
  marked "soon" and the bell carries no dot.
-->
<style>
  @font-face { font-family: "DIN Next LT Arabic"; font-weight: 400; font-display: swap;
               src: url("/assets/fonts/DINNextLTArabic-Regular.ttf") format("truetype"); }
  @font-face { font-family: "DIN Next LT Arabic"; font-weight: 500; font-display: swap;
               src: url("/assets/fonts/DINNextLTArabic-Medium.ttf") format("truetype"); }
  @font-face { font-family: "DIN Next LT Arabic"; font-weight: 700; font-display: swap;
               src: url("/assets/fonts/DINNextLTArabic-Bold.ttf") format("truetype"); }

  :root {
    --brand:       #005459;   /* MOF main colour */
    --brand-hover: #00464A;
    --accent:      #00B878;   /* the logo's green */
    --brand-soft:  #EAF2F2;
    --brand-line:  #BFD6D6;
    --page:        #F5F7F7;
    --panel:       #FFFFFF;
    --ink:         #10292B;
    --muted:       #6F8081;
    --line:        #E2E9E9;
    --bad:         #B42318;  --bad-soft:  #FCEBEA;
    --grey-soft:   #EEF1F1;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(16,41,43,.04), 0 6px 20px rgba(16,41,43,.05);
    --sans: "DIN Next LT Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--page); color: var(--ink); font-family: var(--sans);
         font-size: 15px; line-height: 1.6; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .55; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .hidden { display: none !important; }

  /* ---------- icons: CSS masks, so no markup is ever built at runtime ---------- */
  .ic { display: inline-block; width: 18px; height: 18px; flex: none;
        background: currentColor;
        -webkit-mask: var(--i) center / contain no-repeat; mask: var(--i) center / contain no-repeat; }
  html[dir="ltr"] .flip { transform: scaleX(-1); }
  .i-updown { --i: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M8 9l4-4 4 4M8 15l4 4 4-4'/></svg>"); }
  .i-target { --i: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.8'><circle cx='12' cy='12' r='9'/><circle cx='12' cy='12' r='5'/><circle cx='12' cy='12' r='1.6' fill='black'/></svg>"); }
  .i-bulb { --i: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.4 1.1 2.2h5c0-.8.4-1.6 1.1-2.2A6 6 0 0 0 12 3z'/></svg>"); }
  .i-book { --i: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z'/><path d='M4 19V5M9 8h6'/></svg>"); }
  .i-chat { --i: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='M5 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-7l-5 4v-4H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z'/><path d='M8 9h8M8 12.5h5'/></svg>"); }
  .i-clipboard { --i: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='M9 4h6v3H9z'/><path d='M15 5.5h2A1.5 1.5 0 0 1 18.5 7v12A1.5 1.5 0 0 1 17 20.5H7A1.5 1.5 0 0 1 5.5 19V7A1.5 1.5 0 0 1 7 5.5h2'/><path d='M9 13.5l2 2 4-4'/></svg>"); }
  .i-bell { --i: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='M6 16v-5a6 6 0 1 1 12 0v5l2 2H4z'/><path d='M10 21a2 2 0 0 0 4 0'/></svg>"); }
  .i-search { --i: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='M20 20l-3.5-3.5'/></svg>"); }
  .i-file { --i: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z'/><path d='M14 3v5h5'/></svg>"); }
  .i-record { --i: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><rect x='5' y='3' width='14' height='18' rx='2'/><path d='M9 3v2h6V3M9 11h6M9 15h4'/></svg>"); }
  .i-x { --i: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round'><path d='M6 6l12 12M18 6L6 18'/></svg>"); }
  .i-send { --i: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M19 12H5M11 6l-6 6 6 6'/></svg>"); }
  .i-grid { --i: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2'><rect x='5' y='5' width='4' height='4' rx='1'/><rect x='15' y='5' width='4' height='4' rx='1'/><rect x='5' y='15' width='4' height='4' rx='1'/><rect x='15' y='15' width='4' height='4' rx='1'/></svg>"); }
  .i-logout { --i: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3M14 16l4-4-4-4M18 12H9'/></svg>"); }
  .i-extract { --i: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='M12 3v18M6 8H3M6 16H3M18 8h3M18 16h3M6 12h12'/></svg>"); }
  .i-sync { --i: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'><path d='M20 11a8 8 0 0 0-14.3-4.9L4 8'/><path d='M4 4v4h4'/><path d='M4 13a8 8 0 0 0 14.3 4.9L20 16'/><path d='M20 20v-4h-4'/></svg>"); }
  .i-prev { --i: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M9 6l6 6-6 6'/></svg>"); }
  .i-next { --i: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M15 6l-6 6 6 6'/></svg>"); }

  /* ---------- shared controls ---------- */
  .btn { border: 0; border-radius: 10px; padding: 11px 22px; font-weight: 500;
         background: var(--brand); color: #fff; }
  .btn:hover:not(:disabled) { background: var(--brand-hover); }
  .btn.ghost { background: var(--panel); color: var(--ink); border: 1px solid var(--line); }
  .btn.ghost:hover:not(:disabled) { background: var(--grey-soft); }
  .langtoggle { display: flex; gap: 2px; background: var(--grey-soft); border-radius: 10px; padding: 3px; }
  .langtoggle button { border: 0; background: transparent; border-radius: 8px;
                       padding: 4px 11px; font-size: 13px; font-weight: 500; color: var(--muted); }
  .langtoggle button[aria-pressed="true"] { background: var(--brand); color: #fff; }
  .searchbox { position: relative; display: flex; align-items: center; }
  .searchbox .ic { position: absolute; inset-inline-start: 13px; color: var(--muted); pointer-events: none; }
  .searchbox input { width: 100%; border: 1px solid var(--line); border-radius: 10px;
                     padding: 10px 14px; padding-inline-start: 40px; background: var(--panel); }
  .searchbox input:focus { outline: none; border-color: var(--brand); }

  /* ---------- sign-in ---------- */
  #login { min-height: 100%; display: grid; place-items: center; padding: 32px 16px; position: relative; }
  #login .langtoggle { position: absolute; inset-block-start: 18px; inset-inline-end: 22px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
          box-shadow: var(--shadow); padding: 36px 34px 28px; width: min(430px, 100%); text-align: center; }
  .card .brandlogo { width: 150px; margin: 0 auto 14px; display: block; }
  .card h1 { margin: 8px 0 4px; font-size: 24px; color: var(--brand); font-weight: 700; }
  .card .sub { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  .field { text-align: start; margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .field input { width: 100%; padding: 11px 14px; border: 1px solid var(--line);
                 border-radius: 10px; background: var(--page); }
  .field input:focus { background: var(--panel); outline: none; border-color: var(--brand); }
  #loginBtn { width: 100%; margin-top: 6px; }
  .note { margin: 18px 0 0; font-size: 12px; color: var(--muted); }
  .alert { background: var(--bad-soft); color: var(--bad); border-radius: 10px;
           padding: 9px 12px; font-size: 13.5px; margin-bottom: 14px; text-align: start; }

  /* ---------- app shell ---------- */
  #app { height: 100%; display: grid; grid-template-columns: 272px 1fr; }
  aside { background: var(--panel); border-inline-end: 1px solid var(--line);
          display: flex; flex-direction: column; overflow-y: auto; }
  .side-brand { padding: 20px 16px 16px; text-align: center; border-bottom: 1px solid var(--line); }
  .side-brand img { width: 128px; display: block; margin: 0 auto; }
  .side-title { padding: 16px; text-align: center; font-weight: 700; font-size: 17px;
                border-bottom: 1px solid var(--line); }
  .side-label { font-size: 12.5px; color: var(--muted); margin: 18px 18px 8px; }
  .projectbtn { margin: 0 14px; width: calc(100% - 28px); text-align: start; background: var(--panel);
                border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px;
                display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .projectbtn:hover { border-color: var(--brand-line); }
  .projectbtn b { display: block; font-size: 14.5px; color: var(--ink); font-weight: 700; }
  .projectbtn small { display: block; font-size: 12.5px; color: var(--ink); font-weight: 500; }
  .projectbtn .ic { color: var(--muted); }
  nav { display: flex; flex-direction: column; gap: 4px; padding: 0 10px 18px; }
  nav a { position: relative; display: flex; align-items: center; gap: 12px;
          padding: 11px 12px; border-radius: 12px; text-decoration: none; color: var(--ink); font-size: 15px; }
  nav a .ic { color: var(--brand); width: 20px; height: 20px; }
  nav a .grow { flex: 1; }
  nav a:hover { background: var(--page); }
  nav a.agent.active { background: var(--brand-soft); font-weight: 700; }
  nav a.agent.active .ic { width: 30px; height: 30px; margin: -5px; border-radius: 50%;
                          background: var(--brand); -webkit-mask: none; mask: none; position: relative; }
  nav a.agent.active .ic::after { content: ""; position: absolute; inset: 6px; background: #fff;
                                 -webkit-mask: var(--i) center / contain no-repeat; mask: var(--i) center / contain no-repeat; }
  nav a.agent.active::after { content: ""; position: absolute; inset-block: 6px; inset-inline-end: -10px;
                              width: 4px; border-radius: 4px; background: var(--brand); }
  nav a.soon { color: var(--muted); cursor: default; }
  nav a.soon:hover { background: transparent; }
  nav a.soon .ic { color: var(--muted); }
  .soonpill { font-size: 11px; background: var(--grey-soft); color: var(--muted);
              border-radius: 99px; padding: 1px 9px; }
  nav a.sub { padding-inline-start: 44px; font-size: 14.5px; color: var(--muted); }
  nav a.sub.active { background: var(--brand-soft); color: var(--ink); font-weight: 700; }

  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; }
  .topbar { background: var(--panel); border-bottom: 1px solid var(--line); min-height: 68px;
            padding: 10px 26px; display: flex; align-items: center; gap: 18px; }
  .topbar .titles { flex: 1; min-width: 0; }
  .topbar h2 { margin: 0; font-size: 19px; color: var(--brand); font-weight: 700; }
  .topbar .meta { font-size: 13px; color: var(--muted); }
  .userbox { display: flex; align-items: center; gap: 10px; }
  .avatarwrap { position: relative; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--brand);
            color: #fff; display: grid; place-items: center; font-weight: 700;
            border: 0; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; }
  .avatar:hover { background: var(--brand-hover); }
  .avatar:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  /* Anchored to the avatar rather than the whole user box, so it opens under
     the thing that was clicked in both directions.
     ⚠️ inset-inline-END, not start. The user box sits at the far edge of the
     top bar, so a menu anchored at its start grows outward and off the
     screen — in Arabic it hung past the left edge and produced a horizontal
     scrollbar. Anchoring the end edge makes it grow inward in both
     directions. Found in the browser; no unit test sees layout. */
  .usermenu { position: absolute; top: calc(100% + 8px); inset-inline-end: 0;
              min-width: 190px; padding: 6px; z-index: 40;
              background: var(--panel); border: 1px solid var(--line);
              border-radius: 12px; box-shadow: 0 10px 28px rgba(16,41,43,.16); }
  .usermenu-item { display: flex; align-items: center; gap: 10px; width: 100%;
                   border: 0; background: transparent; color: var(--ink);
                   font: inherit; font-size: 14px; text-align: start;
                   padding: 10px 12px; border-radius: 8px; cursor: pointer; }
  .usermenu-item:hover { background: var(--grey-soft); }
  .usermenu-item .ic { width: 18px; height: 18px; color: var(--muted); }
  .userbox b { display: block; font-size: 14.5px; line-height: 1.3; }
  .userbox span { font-size: 12.5px; color: var(--muted); }
  .iconbtn { border: 0; background: transparent; color: var(--muted); padding: 6px; border-radius: 8px; display: grid; }
  .iconbtn:hover { background: var(--grey-soft); color: var(--ink); }
  .iconbtn .ic { width: 21px; height: 21px; }
  .vsep { width: 1px; align-self: stretch; background: var(--line); margin: 6px 0; }

  /* ---------- chat ---------- */
  .pane { flex: 1; min-height: 0; padding: 22px 26px; display: flex; flex-direction: column; }
  .chatcard { flex: 1; min-height: 0; background: var(--panel); border: 1px solid var(--line);
              border-radius: 18px; display: flex; flex-direction: column; padding: 24px 28px 22px; }
  #chatView { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column;
              gap: 20px; padding: 12px 4px 18px; }
  .daydiv { display: flex; align-items: center; gap: 16px; color: var(--muted); font-size: 13.5px; margin: 6px 0 2px; }
  .daydiv::before, .daydiv::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .msg { max-width: min(78%, 780px); padding: 16px 22px; border-radius: 16px;
         white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.85; font-size: 15.5px;
         /* Each paragraph finds its own direction. The welcome is Arabic then
            English in one bubble, and a single direction for both put the
            English full stop at the wrong end of its line. */
         unicode-bidi: plaintext; text-align: start; }
  .msg.user { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }
  .msg.assistant, .msg.welcome { align-self: flex-end; background: var(--brand); color: #fff; }
  .msg.refusal { align-self: flex-end; background: var(--brand-soft); color: var(--ink);
                 border: 1px solid var(--brand-line); }
  .msg.error { align-self: flex-end; background: var(--bad-soft); color: var(--bad);
               border: 1px solid #F4C7C3; }
  .msg .grounded { display: flex; align-items: center; gap: 7px; font-size: 12.5px;
                   opacity: .9; margin-bottom: 6px; white-space: normal; }
  .msg .grounded .ic { width: 15px; height: 15px; }
  .sources { display: flex; align-items: center; flex-wrap: wrap; gap: 10px;
             margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.22);
             white-space: normal; }
  .msg.refusal .sources { border-top-color: var(--brand-line); }
  .sources > b { font-weight: 500; font-size: 14px; margin-inline-end: 4px; }
  .srcchip { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 500;
             border: 1px solid rgba(255,255,255,.55); border-radius: 10px; padding: 5px 13px; line-height: 1.5; }
  .srcchip .ic { width: 15px; height: 15px; }
  .typing { padding: 16px 22px; }
  .typing span { display: inline-block; width: 7px; height: 7px; margin: 0 2px; border-radius: 50%;
                 background: #fff; animation: blink 1.2s infinite both; }
  .typing span:nth-child(2) { animation-delay: .2s } .typing span:nth-child(3) { animation-delay: .4s }
  @keyframes blink { 0%,80%,100% { opacity: .25 } 40% { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .typing span { animation: none; opacity: .7; } }
  .chips { display: flex; gap: 12px; flex-wrap: wrap; padding: 4px 0 14px; }
  .chips button { border: 1px solid var(--brand-line); background: var(--panel); color: var(--ink);
                  border-radius: 999px; padding: 9px 22px; font-size: 15px; }
  .chips button:hover { border-color: var(--brand); background: var(--brand-soft); }
  .composer { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line);
              border-radius: 14px; padding: 10px 12px; padding-inline-start: 20px; background: var(--panel); }
  .composer:focus-within { border-color: var(--brand-line); }
  .composer textarea { flex: 1; resize: none; border: 0; outline: none; background: transparent;
                       min-height: 30px; max-height: 150px; padding: 6px 0; line-height: 1.6; }
  .composer textarea::placeholder { color: var(--muted); }
  #sendBtn { width: 50px; height: 50px; border: 0; border-radius: 10px; background: var(--brand);
             color: #fff; display: grid; place-items: center; flex: none; }
  #sendBtn:hover:not(:disabled) { background: var(--brand-hover); }
  #sendBtn .ic { width: 20px; height: 20px; }

  /* ---------- knowledge base ---------- */
  #kbView { overflow-y: auto; }
  .kbtitle h1 { margin: 6px 0 4px; font-size: 28px; color: var(--brand); font-weight: 700; }
  .kbtitle p { margin: 0 0 22px; color: var(--muted); font-size: 14.5px; }
  .kbbar { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 18px; }
  /* The pills never wrap among themselves: with the sync card beside the
     search box, "فشلت 0" fell onto a second line on its own. When the row is
     too narrow, the bar wraps whole items instead — card and search move
     down together. */
  .filters { display: flex; align-items: center; gap: 6px; flex: 1 0 auto; flex-wrap: nowrap; }
  .filters button { white-space: nowrap; }
  .filters button { border: 1px solid transparent; background: transparent; color: var(--muted);
                    border-radius: 999px; padding: 8px 18px; font-size: 14.5px; }
  .filters button[aria-pressed="true"] { border: 1.5px solid var(--brand); color: var(--brand); font-weight: 700; }
  .kbbar .searchbox { width: 230px; }
  .kbtools { display: flex; align-items: center; gap: 12px; margin-inline-start: auto; }
  .synccard { display: flex; align-items: center; gap: 10px; background: var(--panel);
              border: 1px solid var(--line); border-radius: 10px; padding: 5px 14px; }
  .synccard .ic { color: var(--brand); width: 19px; height: 19px; }
  .synccard small { display: block; font-size: 12px; color: var(--muted); line-height: 1.3; }

<script>
/* ---------------------------------------------------------------------------

   --------------------------------------------------------------------------- */
const T = {
  ar: {
    platform:"منصة الوكيل الذكي", tagline:"إدارة المخاطر ومحرك الدروس المستفادة والمساعد الذكي — بتسجيل دخول واحد",

    noProjects:"لا توجد مشاريع مسندة إليك.", pickFirst:"اختر مشروعاً أولاً.",

  },
  en: {
    platform:"Smart Agent Platform", tagline:"Risk management, lessons engine and the smart assistant — with a single sign-in",
    email:"Work email", password:"Password", signin:"Sign in",
    ssonote:"In production, sign-in goes through SSO and Active Directory. This is a demo build.",

    grounded:"Drawn from this project's documents", sources:"Sources",
    page:"p.", spmrecord:"SPM project record",
    kbtitle:"Knowledge base", kbsub:"The documents the assistant reads and grounds its answers in for this project.",
    all:"All", indexed:"Indexed", processing:"Processing", failed:"Failed",
    docname:"Document", doctype:"Type", docstate:"Status", kbsearch:"Search documents",
    lastsync:"Last data sync", syncunknown:"Unavailable",
    kbshowing:"Showing {from} to {to} of {total}", kbnone:"No matching documents.",
    prevpage:"Previous", nextpage:"Next",
    pickTitle:"Select a project", pickBody:"Your session locks to the project you choose. Everything the assistant says will come from that project alone.",
    pickSearch:"Search by project code or name", recent:"Recently used", yours:"Your projects",
    pickConfirm:"Lock session to project", cancel:"Cancel", close:"Close", current:"Current session",
    pickHint:"Only projects assigned to you appear here.", pickNone:"No matching projects.",
    switchWarn:"Changing project will end this conversation and start a new one. Continue?",
    noProjects:"You have no assigned projects.", pickFirst:"Choose a project first.",
    loginFailed:"That email or password is not correct.",
    tooFast:"That is a lot of questions at once. Please wait a moment and try again.",
    expired:"Your session has ended. Please sign in again.",
    try1:"Give me an overview of this project", try2:"What are the top risks?", try3:"What is the approved budget?"
  }
};

/* Document types arrive as the pipeline's English labels
   (pipeline/doc_type_labels.json). A type not listed here is shown as it
   arrives rather than hidden — a new label must never make a document
   disappear from the page. */
const DOC_TYPES_AR = {
  "Budget/Financial Report": "تقرير الميزانية المالي",
  "Business Requirements Document": "وثيقة متطلبات الأعمال",
  "Handover Document": "وثيقة التسليم",
  "Lessons Learned": "الدروس المستفادة",
  "Meeting Minutes": "محضر اجتماع",
  "Project Charter": "ميثاق المشروع",
  "Project Charter Template (Generic)": "نموذج ميثاق المشروع",
  "Risk Management Plan Template (Generic)": "نموذج خطة إدارة المخاطر",
  "Risk Register": "سجل المخاطر",
  "Software Design Document": "وثيقة تصميم البرمجيات",
  "Status Dashboard Export": "تقرير لوحة الحالة",
  "Technical Methodology": "المنهجية الفنية",
  "Technical Proposal": "العرض الفني",
  "Weekly Status Report": "تقرير الحالة الأسبوعي",
  "Unclassified": "غير مصنفة",
};

const $ = (id) => document.getElementById(id);
const RTL = /[؀-ۿݐ-ݿﭐ-﷿ﹰ-﻿]/;
const KB_PAGE_SIZE = 5;
const RECENT_KEY = "enjaz.recentProjects";
const RECENT_MAX = 3;
const SESSION_KEY = "enjaz.session";
let UI = "ar", ME = null, PROJECTS = [], CURRENT = null, CONV = null, BUSY = false;
let KB_FILTER = "all", KB_QUERY = "", KB_PAGE = 0, KB_DATA = null;

const t = (key) => T[UI][key] ?? key;
const docType = (label) => (UI === "ar" && DOC_TYPES_AR[label]) || label || "—";

async function api(path, options = {}) {
  const response = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    credentials: "same-origin", ...options,
  });
  if (!response.ok) {
    let detail = `HTTP ${response.status}`;
    try { detail = (await response.json()).detail || detail; } catch (_) {}
    // The server answers a rate limit and an expired session with codes, not
    // prose, so the wording is chosen here in the user's UI language rather
    // than showing an English detail string to an Arabic reader.
    if (response.status === 429) detail = t("tooFast");
    const error = new Error(detail); error.status = response.status; throw error;
  }
  return response.status === 204 ? null : response.json();
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function icon(name) {
  const node = el("span", `ic i-${name}`);
  node.setAttribute("aria-hidden", "true");
  return node;
}

function formatDate(value, withTime = false) {
  // Gregorian with Latin digits, which is how the design writes dates, in
  // the viewer's own timezone — the server sends UTC.
  try {
    const locale = UI === "ar" ? "ar-SA-u-ca-gregory-nu-latn" : "en-GB";
    const options = { day: "numeric", month: "long", year: "numeric" };
    if (withTime) Object.assign(options, { hour: "2-digit", minute: "2-digit" });
    return new Intl.DateTimeFormat(locale, options).format(value);
  } catch (_) {
    return value.toISOString().slice(0, 10);
  }
}

function applyLanguage() {
  document.documentElement.lang = UI;
  document.documentElement.dir = UI === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach((node) => { node.textContent = t(node.dataset.t); });
  document.querySelectorAll("[data-t-title]").forEach((node) => {
    node.title = t(node.dataset.tTitle); node.setAttribute("aria-label", t(node.dataset.tTitle));
  });
  $("q").placeholder = t("placeholder");
  document.querySelectorAll(".langtoggle button").forEach((b) =>
    b.setAttribute("aria-pressed", String(b.dataset.lang === UI)));
  if (ME) renderWho();
  renderTopbar();
  if (KB_DATA) renderKb();
  if (CONV && !$("chips").classList.contains("hidden")) renderChips();
}

/* ---------------------------- sign-in ---------------------------- */
$("loginForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  const btn = $("loginBtn"); btn.disabled = true;
  $("loginError").classList.add("hidden");
  try {
    ME = await api("/api/auth/login", { method: "POST", body: JSON.stringify({
      email: $("email").value.trim(), password: $("password").value }) });
    $("password").value = "";
    await enterApp({ fresh: true });
  } catch (error) {
    // One message for a wrong password and an unknown address — the server
    // does not distinguish them, and neither should the screen.
    $("loginError").textContent = error.status === 403 ? t("loginFailed") : error.message;
    $("loginError").classList.remove("hidden");
  } finally { btn.disabled = false; }
});

$("avatar").addEventListener("click", (event) => {
  event.stopPropagation();   // or the document handler below closes it again
  toggleUserMenu();
});

// Clicking anywhere else, or Escape, puts the menu away. Neither is reachable
// from the DOM shim the tests use, so both are best-effort here and the menu's
// own open/close is what the suite pins.
document.addEventListener("click", closeUserMenu);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeUserMenu(); });

$("logoutBtn").addEventListener("click", async () => {
  closeUserMenu();
  await api("/api/auth/logout", { method: "POST" }).catch(() => {});
  toLogin();
});

function toLogin() {
  // Signing out, or a session that ended, forgets the saved selection: the
  // next sign-in on this browser — perhaps by someone else — chooses afresh.
  clearSession();
  ME = null; CONV = null; CURRENT = null; PROJECTS = [];
  KB_DATA = null; KB_FILTER = "all"; KB_QUERY = ""; KB_PAGE = 0;
  $("chatView").innerHTML = "";
  $("chips").classList.add("hidden");
  // An expiry can arrive with the menu open; it must not be hanging there
  // over the sign-in screen, or waiting when the next person signs in.
  closeUserMenu();
  $("app").classList.add("hidden");
  $("login").classList.remove("hidden");
}

function endSession() {
  // The cookie expired, or the account was removed. Showing a dead chat
  // that 403s on every message is worse than saying so once. The chat is
  // cleared with it: those turns belong to a session that no longer exists.
  toLogin();
  $("loginError").textContent = t("expired");
  $("loginError").classList.remove("hidden");
}

function renderWho() {
  // First and family name only — "نورة الحربي". The server shortens it, so the
  // rules for doing so (titles, "Abd" compounds, the patronymic chain) live in
  // one place; the full name is still on ME for anywhere that wants it.
  const full = UI === "ar" ? ME.full_name_ar : ME.full_name_en;
  const name = (UI === "ar" ? ME.short_name_ar : ME.short_name_en) || full;
  $("whoName").textContent = name;
  $("avatar").textContent = (name || "?").trim()[0];
  // The formal record is no longer on screen, so it becomes the button's
  // label — more use to a screen reader than a generic "account".
  $("avatar").title = full || "";
  $("avatar").setAttribute("aria-label", full || "");
}

function closeUserMenu() {
  $("userMenu").classList.add("hidden");
  $("avatar").setAttribute("aria-expanded", "false");
}

function toggleUserMenu() {
  const open = $("userMenu").classList.contains("hidden");
  $("userMenu").classList.toggle("hidden", !open);
  $("avatar").setAttribute("aria-expanded", open ? "true" : "false");
}

async function enterApp({ fresh = false } = {}) {
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  renderWho();
  PROJECTS = await api("/api/projects");
  CURRENT = null; CONV = null;
  $("chatView").innerHTML = "";
  $("chips").classList.add("hidden");
  renderTopbar();
  if (!PROJECTS.length) { clearSession(); bubble(t("noProjects"), "refusal"); return; }
  // A SIGN-IN always asks: the session is locked to one project, and that is
  // a choice the user makes on purpose each time — never one the page makes
  // from what was used last. A REFRESH is not a sign-in: the user already
  // chose, so the page picks up where they were, and asks only if there is
  // nothing valid to pick up. Switching is the project selector's job.
  if (fresh) clearSession();
  else if (await restoreSession()) return;
  openPicker({ required: true });
}

/* ---------------------------- surviving a refresh ---------------------------- */
/* The project the session is locked to, the conversation under way, and the
   screen, kept in this browser. It decides only where the page resumes: the
   server still authorises the project and the conversation's owner on every
   request, so a stale or tampered entry resumes nothing it should not. It is
   tied to the signed-in username, so one user's selection never carries over
   to another's session on a shared machine. */
function readSession() {
  try {
    const saved = JSON.parse(localStorage.getItem(SESSION_KEY) || "null");
    if (!saved || typeof saved !== "object" || !ME || !ME.username
        || saved.user !== ME.username || typeof saved.project !== "string") return null;
    return { project: saved.project,
             conversation: typeof saved.conversation === "string" ? saved.conversation : null,
             view: saved.view === "kb" ? "kb" : "chat" };
  } catch (_) { return null; }
}

function saveSession() {
  if (!ME || !ME.username || !CURRENT) return;
  const view = $("kbView").classList.contains("hidden") ? "chat" : "kb";
  try {
    localStorage.setItem(SESSION_KEY, JSON.stringify(
      { user: ME.username, project: CURRENT.code, conversation: CONV, view }));
  } catch (_) {}
}

function clearSession() {
  try { localStorage.removeItem(SESSION_KEY); } catch (_) {}
}

async function restoreSession() {
  const saved = readSession();
  // Still assigned? The project list is the server's answer to that.
  const project = saved && PROJECTS.find((p) => p.code === saved.project);
  if (!project) { clearSession(); return false; }
  CURRENT = project;
  renderTopbar();
  if (saved.conversation) await restoreConversation(saved.conversation);
  showView(saved.view);          // opens a new conversation only if none came back
  return true;
}

async function restoreConversation(token) {
  try {
    const transcript = await api(`/api/conversations/${encodeURIComponent(token)}`);
    // Never show one project's exchange under another project's name.
    if (transcript.project_code !== CURRENT.code) return;
    $("chatView").innerHTML = "";
    CONV = transcript.conversation_id;
    dayDivider();
    if (transcript.welcome) bubble(transcript.welcome, "welcome");
    for (const turn of transcript.turns) {
      bubble(turn.question, "user");
      const reply = turn.reply;
      bubble(reply.text, STYLE[reply.outcome] || "assistant", {
        citations: reply.citations, grounded: reply.grounded, lang: reply.reply_language,
      });
    }
    if (!transcript.turns.length) renderChips();
  } catch (_) {
    // Expired, or no longer this user's: not an error worth showing. A new
    // conversation on the same project opens in its place.
    CONV = null;
    $("chatView").innerHTML = "";
  }
}

/* ---------------------------- project names ---------------------------- */
function projectName(project, lang) {
  const own = lang === "ar" ? project.name_ar : project.name_en;
  return own || project.display_name || project.code;
}

function renderTopbar() {
  // The title leads with the UI language and the subtitle carries the other
  // one, as in the design: "مشروع التحول الرقمي - PRJ-…" over "Digital …".
  const none = PROJECTS.length ? t("pickFirst") : t("noProjects");
  const title = CURRENT ? `${projectName(CURRENT, UI)} - ${CURRENT.code}` : none;
  const alt = CURRENT ? (UI === "ar" ? CURRENT.name_en : CURRENT.name_ar) || "" : "";
  $("barTitle").textContent = title;
  $("barMeta").textContent = alt;
  $("projName").textContent = CURRENT ? projectName(CURRENT, UI) : none;
  $("projCode").textContent = CURRENT ? CURRENT.code : "—";
}

/* ---------------------------- recently used ---------------------------- */
/* Remembered in this browser only. It changes which projects are listed
   first and nothing else: what a user may open is still decided by the
   server on every request. Storage can be unavailable (private windows,
   blocked site data), so every read and write fails soft. */
function recentProjects() {
  try {
    const stored = JSON.parse(localStorage.getItem(RECENT_KEY) || "[]");
    return Array.isArray(stored) ? stored.filter((c) => typeof c === "string") : [];
  } catch (_) { return []; }
}

function rememberProject(code) {
  const next = [code, ...recentProjects().filter((c) => c !== code)].slice(0, RECENT_MAX);
  try { localStorage.setItem(RECENT_KEY, JSON.stringify(next)); } catch (_) {}
  return next;
}

/* ---------------------------- project picker ---------------------------- */
function openPicker({ required = false } = {}) {
  // `required` is the picker shown right after sign-in: there is no session
  // yet, so there is nothing to go back to — no close, no cancel, and nothing
  // pre-selected, so locking the session is always an explicit choice.
  if (!PROJECTS.length) return;
  let chosen = required ? null : (CURRENT ? CURRENT.code : PROJECTS[0].code);
  let query = "";

  const backdrop = el("div", "backdrop");
  const modal = el("div", "modal");
  modal.setAttribute("role", "dialog"); modal.setAttribute("aria-modal", "true");

  const head = el("div", "modalhead");
  const heading = el("div");
  heading.append(el("h3", "", t("pickTitle")), el("p", "lead", t("pickBody")));
  const closeBtn = el("button", "iconbtn"); closeBtn.type = "button";
  closeBtn.title = t("close"); closeBtn.setAttribute("aria-label", t("close"));
  closeBtn.append(icon("x"));
  head.append(heading);
  if (!required) head.append(closeBtn);

  const search = el("label", "searchbox");
  const input = el("input"); input.type = "search"; input.placeholder = t("pickSearch");
  search.append(icon("search"), input);

  const body = el("div", "modalbody");

  const foot = el("div", "modalfoot");
  const okBtn = el("button", "btn", t("pickConfirm")); okBtn.type = "button";
  const cancelBtn = el("button", "btn ghost", t("cancel")); cancelBtn.type = "button";
  foot.append(el("span", "hint", t("pickHint")));
  if (!required) foot.append(cancelBtn);
  foot.append(okBtn);

  modal.append(head, search, body, foot);
  backdrop.append(modal);

  const row = (project) => {
    const button = el("button", "pick"); button.type = "button";
    button.setAttribute("aria-pressed", String(project.code === chosen));
    const names = el("span", "names");
    const both = [project.name_ar, project.name_en].filter(Boolean).join(" — ")
                 || project.display_name || project.code;
    names.append(el("small", "", project.code), el("b", "", both));
    button.append(names);
    if (CURRENT && project.code === CURRENT.code) button.append(el("span", "currentpill", t("current")));
    button.append(icon("grid"));
    button.addEventListener("click", () => { chosen = project.code; render(); });
    return button;
  };

  const render = () => {
    okBtn.disabled = !chosen;
    body.innerHTML = "";
    const q = query.trim().toLowerCase();
    const matches = PROJECTS.filter((p) => !q ||
      [p.code, p.name_ar, p.name_en, p.display_name].some((v) => (v || "").toLowerCase().includes(q)));
    const recentCodes = recentProjects();
    const recent = recentCodes.map((c) => matches.find((p) => p.code === c)).filter(Boolean);
    const rest = matches.filter((p) => !recent.includes(p));
    if (!matches.length) { body.append(el("p", "grouplabel", t("pickNone"))); return; }
    if (recent.length) {
      body.append(el("p", "grouplabel", t("recent")));
      recent.forEach((p) => body.append(row(p)));
    }
    if (rest.length) {
      body.append(el("p", "grouplabel", t("yours")));
      rest.forEach((p) => body.append(row(p)));
    }
  };
  render();

  const close = () => { backdrop.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = (e) => { if (e.key === "Escape" && !required) close(); };
  input.addEventListener("input", () => { query = input.value; render(); });
  closeBtn.addEventListener("click", close);
  cancelBtn.addEventListener("click", close);
  backdrop.addEventListener("click", (e) => { if (e.target === backdrop && !required) close(); });
  document.addEventListener("keydown", onKey);
  okBtn.addEventListener("click", () => {
    const next = PROJECTS.find((p) => p.code === chosen);
    if (!next) return;                       // nothing chosen yet: stay open
    close();
    if (!next || (CURRENT && next.code === CURRENT.code)) return;
    // A conversation is bound to one project for its lifetime, so switching
    // means a new one. Confirm first when there is something to lose: the
    // chat always holds the date line and the welcome.
    if (CONV && $("chatView").children.length > 2 && !confirm(t("switchWarn"))) return;
    switchProject(next);
  });
  document.body.append(backdrop);
  try { input.focus(); } catch (_) {}
}

function switchProject(next) {
  CURRENT = next; CONV = null; KB_DATA = null; KB_PAGE = 0; KB_QUERY = ""; KB_FILTER = "all";
  rememberProject(next.code);
  saveSession();
  $("chatView").innerHTML = "";
  renderTopbar();
  if (!$("chatPane").classList.contains("hidden")) startConversation();
  if (!$("kbView").classList.contains("hidden")) loadKb();
}
$("projectBtn").addEventListener("click", openPicker);

/* ---------------------------- views ---------------------------- */
function showView(name) {
  $("chatPane").classList.toggle("hidden", name !== "chat");
  $("kbView").classList.toggle("hidden", name !== "kb");
  if (name !== "chat") $("chips").classList.add("hidden");
  document.querySelectorAll("nav a.sub").forEach((a) => {
    const active = name === "kb" ? a.dataset.view === "kb"
                                 : a.dataset.view === "chat";
    a.classList.toggle("active", active);
  });
  if (name === "chat" && !CONV) startConversation();
  if (name === "kb") loadKb();
  saveSession();
}
document.querySelectorAll("nav a").forEach((a) =>
  a.addEventListener("click", (e) => {
    e.preventDefault();
    if (a.dataset.view) showView(a.dataset.view);
  }));

/* ---------------------------- chat ---------------------------- */
function dayDivider() {
  const node = el("div", "daydiv", `${t("today")} : ${formatDate(new Date())}`);
  $("chatView").append(node);
  return node;
}

function sourceChip(citation) {
  // Built from the citation's fields, never from the model's words. The
  // label is the fallback, so a citation with nothing else still reads.
  const chip = el("span", "srcchip");
  if (citation.source === "project_record") {
    chip.append(icon("record"), el("span", "", t("spmrecord")));
    return chip;
  }
  const name = citation.doc_type ? docType(citation.doc_type)
                                 : (citation.filename || citation.label || "");
  const where = citation.page ? `${t("page")} ${citation.page}` : (citation.section || "");
  chip.append(icon("file"), el("span", "", where ? `${name} - ${where}` : name));
  return chip;
}

function bubble(text, kind, { citations = [], grounded = false, lang = "" } = {}) {
  const node = el("div", `msg ${kind}`);
  node.dir = lang === "ar" ? "rtl" : lang === "en" ? "ltr"
           : (RTL.test(text) ? "rtl" : "ltr");
  if (grounded && citations.some((c) => c.source !== "project_record")) {
    const line = el("div", "grounded");
    line.append(icon("extract"), el("span", "", t("grounded")));
    node.append(line);
  }
  if (node.children.length || citations.length) {
    node.append(el("div", "", text));
  } else {
    node.textContent = text;
  }
  if (citations.length) {
    const box = el("div", "sources");
    box.append(el("b", "", t("sources")));
    // Several passages often come from the same page of the same document,
    // and each is its own citation. The reader needs each SOURCE once, so
    // chips that would read identically are shown a single time.
    const seen = new Set();
    for (const c of citations) {
      const chip = sourceChip(c);
      if (seen.has(chip.textContent)) continue;
      seen.add(chip.textContent);
      box.append(chip);
    }
    node.append(box);
  }
  $("chatView").append(node);
  $("chatView").scrollTop = $("chatView").scrollHeight;
  return node;
}

async function startConversation() {
  $("chatView").innerHTML = "";
  if (!CURRENT) { bubble(t("pickFirst"), "refusal"); return; }
  try {
    const opened = await api("/api/conversations", { method: "POST",
      body: JSON.stringify({ project_code: CURRENT.code, ui_language: UI }) });
    CONV = opened.conversation_id;
    saveSession();
    dayDivider();
    // AC04 — shown before anything is typed, so it is bilingual: with no
    // message there is no language to reply in.
    bubble(opened.welcome, "welcome");
    renderChips();
  } catch (error) {
    if (error.status === 403 && ME) return endSession();
    bubble(error.message, "error");
  }
}

function renderChips() {
  // Fixed starters. They are ordinary messages, not a menu: each one goes
  // through the same path as anything typed, so the model still classifies
  // it rather than being handed a pre-decided intent.
  const box = $("chips");
  box.innerHTML = "";
  for (const key of ["try1", "try2", "try3"]) {
    const b = el("button", "", t(key));
    b.type = "button";
    b.addEventListener("click", () => { box.classList.add("hidden"); ask(t(key)); });
    box.append(b);
  }
  box.classList.remove("hidden");
}

/* An outcome decides how a reply is SHOWN. The model already decided what
   it is; this only picks a colour. */
const STYLE = { answered:"assistant", conversational:"assistant",
                out_of_scope:"refusal", rejected_language:"refusal" };

async function ask(text) {
  if (!CONV || BUSY) return;
  BUSY = true; $("sendBtn").disabled = true;
  $("chips").classList.add("hidden");
  bubble(text, "user");
  const pending = bubble("", "assistant");
  pending.classList.add("typing");
  pending.innerHTML = "<span></span><span></span><span></span>";
  try {
    const reply = await api(`/api/conversations/${CONV}/messages`,
      { method: "POST", body: JSON.stringify({ text }) });
    pending.remove();
    bubble(reply.text, STYLE[reply.outcome] || "assistant", {
      citations: reply.citations, grounded: reply.grounded, lang: reply.reply_language,
    });
  } catch (error) {
    pending.remove();
    if (error.status === 403 && ME) { return endSession(); }
    bubble(error.message, "error");
  } finally { BUSY = false; $("sendBtn").disabled = false; $("q").focus(); }
}

$("composer").addEventListener("submit", (event) => {
  event.preventDefault();
  const text = $("q").value.trim();
  if (!text) return;
  $("q").value = ""; $("q").style.height = "auto";
  ask(text);
});
$("q").addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault(); $("composer").requestSubmit();
  }
});
$("q").addEventListener("input", (event) => {
  event.target.style.height = "auto";
  event.target.style.height = Math.min(event.target.scrollHeight, 150) + "px";
});

/* ---------------------------- knowledge base ---------------------------- */
async function loadKb() {
  $("kbView").innerHTML = "";
  if (!CURRENT) { $("kbView").append(el("p", "", t("pickFirst"))); return; }
  try {
    KB_DATA = await api(`/api/projects/${encodeURIComponent(CURRENT.code)}/documents`);
    renderKb();
  } catch (error) {
    if (error.status === 403 && ME) return endSession();
    $("kbView").innerHTML = "";
    $("kbView").append(el("div", "msg error", error.message));
  }
}

function syncCard(lastSync) {
  // When the daily sync last succeeded — not when a document last changed.
  // An unchanged project is still checked every day; its newest document
  // date would make current data look weeks stale. Missing or unreadable
  // is said as such, never shown as a date that is not true.
  const card = el("div", "synccard");
  card.append(icon("sync"));
  const text = el("div");
  const when = lastSync ? new Date(lastSync) : null;
  const valid = when && !Number.isNaN(when.getTime());
  text.append(el("small", "", t("lastsync")),
              el("b", "", valid ? formatDate(when, true) : t("syncunknown")));
  card.append(text);
  return card;
}

function statusOf(doc) {
  // Anything not finished and not failed is still in the pipeline.
  return doc.indexing_status === "indexed" ? "indexed"
       : doc.indexing_status === "failed" ? "failed" : "processing";
}

function renderKb() {
  const docs = KB_DATA.documents;
  const counts = { all: docs.length, indexed: 0, processing: 0, failed: 0 };
  docs.forEach((d) => { counts[statusOf(d)]++; });

  const q = KB_QUERY.trim().toLowerCase();
  const rows = docs.filter((d) =>
    (KB_FILTER === "all" || statusOf(d) === KB_FILTER) &&
    (!q || [d.filename, d.doc_type, docType(d.doc_type)].some((v) => (v || "").toLowerCase().includes(q))));
  const pages = Math.max(1, Math.ceil(rows.length / KB_PAGE_SIZE));
  KB_PAGE = Math.min(KB_PAGE, pages - 1);
  const start = KB_PAGE * KB_PAGE_SIZE;
  const shown = rows.slice(start, start + KB_PAGE_SIZE);

  const view = $("kbView");
  view.innerHTML = "";

  const title = el("div", "kbtitle");
  title.append(el("h1", "", t("kbtitle")), el("p", "", t("kbsub")));
  view.append(title);

  const bar = el("div", "kbbar");
  const filters = el("div", "filters");
  for (const key of ["all", "indexed", "processing", "failed"]) {
    const b = el("button", "", `${t(key)} ${counts[key]}`);
    b.type = "button";
    b.setAttribute("aria-pressed", String(KB_FILTER === key));
    b.addEventListener("click", () => { KB_FILTER = key; KB_PAGE = 0; renderKb(); });
    filters.append(b);
  }
  const search = el("label", "searchbox");
  const input = el("input"); input.type = "search";
  input.placeholder = t("kbsearch"); input.value = KB_QUERY;
  input.addEventListener("input", () => {
    KB_QUERY = input.value; KB_PAGE = 0; renderKb();
    const again = $("kbView").querySelector("input");
    if (again && again.focus) { again.focus(); again.setSelectionRange?.(KB_QUERY.length, KB_QUERY.length); }
  });
  search.append(icon("search"), input);
  // The card and the search box are one group, so a narrow screen moves
  // them down together instead of separating them.
  const tools = el("div", "kbtools");
  tools.append(syncCard(KB_DATA.last_sync), search);
  bar.append(filters, tools);
  view.append(bar);

  const card = el("div", "tablecard");
  const table = el("table");
  const thead = el("thead");
  const hr = el("tr");
  for (const key of ["docname", "doctype", "docstate"]) hr.append(el("th", "", t(key)));
  thead.append(hr);
  const tbody = el("tbody");
  if (!shown.length) {
    const tr = el("tr"); const td = el("td", "muted", t("kbnone"));
    td.colSpan = 3; tr.append(td); tbody.append(tr);
  }
  for (const d of shown) {
    const tr = el("tr");
    const state = el("td");
    const status = statusOf(d);
    state.append(el("span", `status ${status}`, t(status)));
    tr.append(el("td", "docname", d.filename), el("td", "", docType(d.doc_type)), state);
    tbody.append(tr);
  }
  table.append(thead, tbody);
  card.append(table);

  const pager = el("div", "pager");
  const prev = el("button"); prev.type = "button"; prev.title = t("prevpage");
  prev.setAttribute("aria-label", t("prevpage")); prev.append(icon("prev"));
  prev.disabled = KB_PAGE === 0;
  prev.addEventListener("click", () => { KB_PAGE--; renderKb(); });
  const next = el("button"); next.type = "button"; next.title = t("nextpage");
  next.setAttribute("aria-label", t("nextpage")); next.append(icon("next"));
  next.disabled = KB_PAGE >= pages - 1;
  next.addEventListener("click", () => { KB_PAGE++; renderKb(); });
  const summary = t("kbshowing")
    .replace("{from}", rows.length ? start + 1 : 0)
    .replace("{to}", start + shown.length)
    .replace("{total}", rows.length);
  pager.append(prev, next, el("span", "spacer"), el("span", "", summary));
  card.append(pager);
  view.append(card);
}

/* ---------------------------- boot ---------------------------- */
document.querySelectorAll(".langtoggle button").forEach((b) =>
  b.addEventListener("click", () => { UI = b.dataset.lang; applyLanguage(); }));

(async function start() {
  applyLanguage();
  try {
    ME = await api("/api/auth/me");
    await enterApp({ fresh: false });      // a refresh with a live session
  } catch (_) {
    // Not signed in — the sign-in screen is already the visible one.
  }
})();
</script>
</body>
</html>
